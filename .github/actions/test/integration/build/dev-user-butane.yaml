variant: fcos
version: 1.3.0
passwd:
  users:
    - name: root
      password_hash: "PASSWORD_GOES_HERE"
storage:
  files:
  - path: /etc/ssh/sshd_config
    mode: 0644
    overwrite: true
    contents:
      inline: |
        PermitRootLogin yes
        AuthorizedKeysFile /etc/ssh/authorized_keys
        Protocol 2
        AuthenticationMethods publickey password
        Subsystem sftp /usr/lib/openssh/sftp-server
  # can't store in /root, is a tmpfs
  - path: /etc/ssh/authorized_keys
    mode: 0600
    contents:
      inline: "SSH_KEY_GOES_HERE"
  - path: /etc/hosts
    mode: 0644
    overwrite: true
    contents:
      inline: |
        # defaults
        127.0.0.1	localhost
        127.0.1.1	garden

        ::1     localhost ip6-localhost ip6-loopback
        ff02::1 ip6-allnodes
        ff02::2 ip6-allrouters

        # custom
        192.168.122.2 hv1
        192.168.122.3 hv2
  # turn off hugepages, not required for this test
  # also SIGNIFICANTLY reduces test runtime
  - path: /opt/persist/hugepages.env
    mode: 0755
    contents:
      inline: |
        NON_HUGEPAGES_PM=1000
  - path: /opt/persist/gl-oci.conf
    mode: 0644
    contents:
      inline: |
        # pull the image from GHCR instead of keppel
        OCI_REPO=ghcr.io/gardenlinux/gardenlinux-sci
        # point to a custom tag to download for the persist step
        OCI_TAG=TAG_GOES_HERE
  # Hook called by persist (chrooted into the new sysroot) after the UKI is
  # downloaded and before systemd-repart partitions the disk.
  # Ensures the second boot brings networking up (DHCP) and starts SSH so the
  # CI can reach the VM. Does NOT depend on objcopy/binutils being present.
  - path: /opt/persist/network_up.sh
    mode: 0755
    contents:
      inline: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        # Drop a systemd-networkd config so the second boot gets DHCP on all
        # Ethernet interfaces (virtio-net shows up as e*). This is the critical
        # fix: without it the second boot never acquires a DHCP lease.
        mkdir -p /etc/systemd/network
        printf '[Match]\nName=e*\n\n[Network]\nDHCP=yes\n' \
            > /etc/systemd/network/80-dhcp.network
        echo "Wrote /etc/systemd/network/80-dhcp.network for second-boot DHCP"

        # Enable networking and SSH via systemctl --root so symlinks are created
        # even though systemd is not running inside the chroot.
        systemctl --root=/ enable systemd-networkd.service || true
        systemctl --root=/ enable ssh.service || true

        # Best-effort: patch the downloaded UKI's .cmdline section so the second
        # boot also has serial console output and ignition can configure SSH.
        # Only attempt this if objcopy is actually available; its absence must
        # not abort the script (which would skip the networking fix above).
        if command -v objcopy >/dev/null 2>&1; then
            UKI=$(ls /efi/EFI/Linux/*.efi 2>/dev/null | head -1 || true)
            if [ -n "$UKI" ]; then
                objcopy --dump-section .cmdline=/tmp/cmdline.bin "$UKI"
                CURRENT=$(tr -d '\0\n' < /tmp/cmdline.bin)
                printf '%s' "$CURRENT console=ttyS0 ignition.platform.id=qemu" \
                    > /tmp/cmdline-new.bin
                objcopy --update-section .cmdline=/tmp/cmdline-new.bin \
                    "$UKI" "${UKI}.patched"
                mv "${UKI}.patched" "$UKI"
                echo "Patched second-boot UKI cmdline: $CURRENT console=ttyS0 ignition.platform.id=qemu"
            fi
        else
            echo "objcopy not available; skipping UKI cmdline patch"
        fi
  # Enable unlimited core dumps for all systemd services
  - path: /etc/systemd/system.conf.d/10-core.conf
    mode: 0644
    contents:
      inline: |
        [Manager]
        DefaultLimitCORE=infinity
  # Configure systemd-coredump with reasonable limits
  - path: /etc/systemd/coredump.conf.d/50-ci-core.conf
    mode: 0644
    contents:
      inline: |
        [Coredump]
        Storage=external
        ProcessSizeMax=3G
        ExternalSizeMax=3G
        MaxUse=2G
        KeepFree=1G
        Compress=yes
  # Set kernel core pattern to use systemd-coredump
  - path: /etc/sysctl.d/50-core.conf
    mode: 0644
    contents:
      inline: |
        kernel.core_pattern=|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h
        kernel.core_pipe_limit=16
        fs.suid_dumpable=2
# Disable libvirt sockets not required for CI tests
systemd:
  units:
    - name: libvirtd-tls.socket
      mask: true
    - name: libvirtd-tcp.socket
      mask: true
    - name: ssh.service
      enabled: true
