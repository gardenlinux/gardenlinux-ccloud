name: dev
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "**/README.md"
      - "docs/**"

# Cancel any in-progress PR workflow runs when PR is closed
# Used to ensure cleanup runs after any PR build are uploaded (or aborts before the upload)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'closed' }}

jobs:
  set_version:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: use VERSION file to support dev build on rel-branch
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "VERSION=$(./gardenlinux/bin/garden-version now)" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [set_version]
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    uses: gardenlinux/gardenlinux/.github/workflows/build.yml@c15e9789b16b0e64019b52b45fb6fa3b3c0f608c
    with:
      version: ${{ needs.set_version.outputs.VERSION }}
      # to set target to "release" or "nightly" we need proper KMS secrets
      # have a look at gardenlinux/.github/workflows/github.mjs
      target: dev
      fail_fast: true
    # secrets:
      # aws_region: ${{ secrets.AWS_REGION }}
      # aws_kms_role: ${{ secrets.KMS_SIGNING_IAM_ROLE }}
      # aws_oidc_session: ${{ secrets.AWS_OIDC_SESSION }}
      # secureboot_db_kms_arn: ${{ secrets.SECUREBOOT_DB_KMS_ARN }}

  meta:
    name: Compute image metadata
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      UPLOAD_VERSION: ${{ steps.meta.outputs.upload_version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute image metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          UPLOAD_VERSION="pr-${PR_NUMBER}"
          echo "upload_version=${UPLOAD_VERSION}" >> $GITHUB_OUTPUT
          IMAGE_TAG=$(.github/scripts/compute-image-tag.sh "${UPLOAD_VERSION}")
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  test:
    name: Test PR image
    needs: [set_version, meta, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-baremetal-sci_usi-amd64
      - name: Extract UKI from build artifact
        id: extract_uki
        run: |
          CNAME=$(ls *.tar.gz | head -1 | sed 's/.tar.gz//')
          mkdir -p extracted
          tar -C extracted -xzf "$CNAME.tar.gz"
          UKI_PATH=$(find extracted -name "*.uki" | head -1)
          if [ -z "$UKI_PATH" ]; then
            echo "::error::No .uki file found in build artifact"
            ls -la extracted/ || true
            exit 1
          fi
          echo "Found UKI at: $UKI_PATH"
          echo "uki_path=$UKI_PATH" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        uses: ./.github/actions/test/integration/dependencies
      - name: Build test environment
        uses: ./.github/actions/test/integration/build
        with:
          image_tag: ${{ needs.meta.outputs.image_tag }}
          uki_path: ${{ steps.extract_uki.outputs.uki_path }}
      - name: Setup
        uses: ./.github/actions/test/integration/setup
      - name: Test QEMU
        uses: ./.github/actions/test/integration/test/qemu
      - name: Test CloudHypervisor
        uses: ./.github/actions/test/integration/test/cloudhypervisor
      - name: Collect Debug Logs
        if: always()
        uses: ./.github/actions/test/integration/collect-logs

  upload:
    name: Upload PR image to OCI
    needs: [build, meta, set_version, test]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    uses: ./.github/workflows/upload_oci.yml
    with:
      version: ${{ needs.set_version.outputs.VERSION }}
      upload_version: ${{ needs.meta.outputs.UPLOAD_VERSION }}
      flavor_filter: '--include-only "baremetal-sci_usi-amd64"'
    secrets: inherit

  cleanup_images:
    name: Cleanup PR images
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup OCI images via GitHub API
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          UPLOAD_VERSION="pr-${PR_NUMBER}"

          all_version_ids=""
          page=1
          page_size=100

          # Collect all matching version IDs across pages
          while true; do
            response=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/gardenlinux/packages/container/gardenlinux-sci/versions?per_page=$page_size&page=$page")

            page_ids=$(echo "$response" | jq -r --arg prefix "${UPLOAD_VERSION}" '
              .[] | select(.metadata.container.tags[]? | test("^" + $prefix + "(-.*)?$")) | .id
            ')
            if [ -n "$page_ids" ]; then
              all_version_ids="$all_version_ids $page_ids"
            fi

            page_count=$(echo "$response" | jq '. | length')
            if [ "$page_count" -lt "$page_size" ]; then
              # Stop if this was the last page
              break
            fi

            page=$((page + 1))
          done

          if [ -z "$all_version_ids" ]; then
            echo "No images found for PR ${PR_NUMBER}"
            exit 0
          fi

          for version_id in $all_version_ids; do
            echo "Deleting version $version_id"
            http_code=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/gardenlinux/packages/container/gardenlinux-sci/versions/$version_id")
            if [ "$http_code" != "204" ]; then
              echo "Failed to delete version $version_id (HTTP $http_code)"
            fi
          done
